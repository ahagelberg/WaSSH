name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/wassh.exe README.md TODO.md "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-windows
          path: dist/*.zip
          if-no-files-found: error

  release-mac:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-macos-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh README.md TODO.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-mac-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-linux:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Install windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh packaging/wassh.desktop README.md TODO.md "dist/$name/"
          cp "res/WaSSH program icon.png" "dist/$name/wassh.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
