name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler not found' }
          & $compiler "/DVERSION=$version" packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installer
        shell: pwsh
        run: |
          $installer = (Get-Item dist/*-win-setup-x64.exe).FullName
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\WaSSH Native'
          $executable = Join-Path $installDir 'wassh.exe'
          $expectedHash = (Get-FileHash target/release/wassh.exe).Hash
          foreach ($attempt in 1..2) {
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if ((Get-FileHash $executable).Hash -ne $expectedHash) { throw 'Installed executable does not match the build' }
          }
          $process = Start-Process -FilePath (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Test-Path $executable) { throw 'Uninstaller did not remove the executable' }

      - name: Package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/wassh.exe README.md TODO.md "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release-mac:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-macos-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh README.md TODO.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-mac-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-linux:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Install windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh packaging/wassh.desktop README.md TODO.md "dist/$name/"
          cp "res/WaSSH program icon.png" "dist/$name/wassh.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
