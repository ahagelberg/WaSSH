name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Validate tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm run setup-native

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish release
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # electron-builder can occasionally leave duplicate releases on one tag with
      # assets split across them. Keep only the release that carries latest.yml,
      # otherwise the in-app updater cannot find the update metadata.
      - name: Keep only the complete release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${tag}\") | .id"); do
            has_latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq '[.[].name] | index("latest.yml") != null')
            if [ "$has_latest" != "true" ]; then
              echo "Deleting duplicate release ${id} on ${tag} (missing latest.yml)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release-mac:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
            expected_uname: x86_64
          - runner: macos-14
            arch: arm64
            expected_uname: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.expected_uname }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.expected_uname }}, got ${actual_uname}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm run setup-native
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build macOS artifacts
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never

      - name: Attach macOS assets to GitHub release
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/*.dmg release/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release-linux:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            expected_uname: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            expected_uname: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.expected_uname }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.expected_uname }}, got ${actual_uname}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm run setup-native
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build Linux artifacts
        run: npm run dist:linux -- --${{ matrix.arch }} --publish never

      - name: Attach Linux assets to GitHub release
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/*.AppImage release/*.deb release/*.rpm --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
