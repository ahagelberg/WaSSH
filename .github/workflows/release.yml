name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned so a release builds with the packager it was tested with.
  NFPM_VERSION: v2.49.0

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler not found' }
          & $compiler "/DVERSION=$version" packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installer
        shell: pwsh
        run: |
          $installer = (Get-Item dist/*-win-setup-x64.exe).FullName
          $installDir = Join-Path $env:ProgramFiles 'WaSSH Native'
          $executable = Join-Path $installDir 'wassh.exe'
          $expectedHash = (Get-FileHash target/release/wassh.exe).Hash
          foreach ($attempt in 1..2) {
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if ((Get-FileHash $executable).Hash -ne $expectedHash) { throw 'Installed executable does not match the build' }
          }
          $process = Start-Process -FilePath (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Test-Path $executable) { throw 'Uninstaller did not remove the executable' }

      - name: Package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/wassh.exe README.md TODO.md "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release-mac:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Build
        run: cargo build --release -p wassh

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-macos-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh README.md TODO.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-mac-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release-linux:
    needs: release-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner architecture
        run: |
          actual_uname="$(uname -m)"
          if [ "${actual_uname}" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner architecture mismatch: expected ${{ matrix.arch }}, got ${actual_uname}"
            exit 1
          fi

      - name: Install windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release -p wassh

      - name: Build AppImage
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          arch="${{ matrix.arch }}"
          appdir="dist/WaSSH.AppDir"
          rm -rf "$appdir"
          # The AppDir is the image's own file system: the binary, its entry and its icon.
          install -Dm755 target/release/wassh "$appdir/usr/bin/wassh"
          install -Dm644 packaging/wassh.desktop "$appdir/wassh.desktop"
          install -Dm644 packaging/wassh.desktop "$appdir/usr/share/applications/wassh.desktop"
          install -Dm644 "res/WaSSH program icon.png" "$appdir/wassh.png"
          install -Dm644 "res/WaSSH program icon.png" \
            "$appdir/usr/share/icons/hicolor/512x512/apps/wassh.png"
          ln -s usr/bin/wassh "$appdir/AppRun"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x appimagetool
          # The runners have no FUSE, and none is needed to pack an image.
          VERSION="$version" ARCH="$arch" ./appimagetool --appimage-extract-and-run \
            "$appdir" "dist/wassh-$version-linux-$arch.AppImage"
          rm -f appimagetool
          ls -l dist/*.AppImage

      - name: Build Debian and RPM packages
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # nfpm names its builds by Go architecture, and its assets mix the two schemes:
          # amd64 ships as x86_64, arm64 as arm64.
          case "${{ matrix.arch }}" in
            aarch64) package_arch=arm64; asset_arch=arm64 ;;
            *) package_arch=amd64; asset_arch=x86_64 ;;
          esac
          curl -fsSL -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_${asset_arch}.tar.gz"
          tar -xzf nfpm.tgz nfpm
          for packager in deb rpm; do
            VERSION="$version" ARCH="$package_arch" ./nfpm package \
              --config packaging/nfpm.yaml --packager "$packager" --target dist/
          done
          rm -f nfpm nfpm.tgz
          ls -l dist/*.deb dist/*.rpm

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="wassh-$version-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/wassh packaging/wassh.desktop README.md TODO.md "dist/$name/"
          cp "res/WaSSH program icon.png" "dist/$name/wassh.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wassh-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
