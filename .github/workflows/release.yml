name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm run setup-native

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # electron-builder can occasionally leave duplicate releases on one tag with
      # assets split across them. Keep only the release that carries latest.yml,
      # otherwise the in-app updater cannot find the update metadata.
      - name: Keep only the complete release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${tag}\") | .id"); do
            has_latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq '[.[].name] | index("latest.yml") != null')
            if [ "$has_latest" != "true" ]; then
              echo "Deleting duplicate release ${id} on ${tag} (missing latest.yml)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wassh-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
