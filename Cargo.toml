[workspace]
resolver = "3"
members = [
    "crates/wassh",
    "crates/wassh-core",
    "crates/wassh-store",
    "crates/wassh-ssh",
    "crates/wassh-mqtt",
    "crates/wassh-telnet",
    "crates/wassh-serial",
    "crates/wassh-term",
    "crates/wassh-term-render",
    "crates/wassh-sys",
    "crates/wassh-ui",
    "crates/wassh-plugins",
]
# Patched copies of winit 0.30.13 and egui-winit 0.37; see vendor/*/PATCHED.md.
exclude = ["vendor/winit", "vendor/egui-winit"]

[patch.crates-io]
winit = { path = "vendor/winit" }
egui-winit = { path = "vendor/egui-winit" }

[workspace.package]
version = "2.0.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Andreas Hagelberg <andreas@hagelberg.name>"]

[workspace.dependencies]
aes-gcm = "0.11"
alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
eframe = "0.37"
egui = "0.37"
# eframe's windowing layer; used only to ask for the X11 (XWayland) backend, because
# Wayland cannot restore a saved window position.
winit = "0.30"
getrandom = "0.3"
portable-pty = "0.9"
regex = "1"
# Blocking HTTP for the AI agent's provider calls; rustls, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Native open/save dialogs. The XDG portal backend talks to the desktop over
# D-Bus (and falls back to zenity), so there is no GTK3 build requirement.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# ring instead of the default aws-lc-rs: aws-lc-sys needs NASM/CMake to build.
russh = { version = "0.64", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
    "macros",
] }
vte = "0.15"
# Win32 bindings for the native system facts; only compiled on Windows.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Wdk_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `cargo run` builds this profile. Unoptimised egui/serde_json/alacritty made
# the window crawl as soon as a pane drew a long list, so the dependencies are
# built with full optimisation while our own crates stay cheap to recompile
# (they get light optimisation and keep line numbers for debuggers).
[profile.dev]
opt-level = 1
# Line tables only. Full DWARF let `target/` reach 4 GB and the binary 750 MB for no
# benefit: backtraces still name the file and line, and the build is quicker.
debug = 1

[profile.dev.package."*"]
opt-level = 3
# Dependencies are stepped into rarely and their debug info is most of `target/`.
debug = false
