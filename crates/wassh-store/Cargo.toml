[package]
name = "wassh-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WaSSH configuration persistence: atomic JSON documents and data paths"

[dependencies]
aes-gcm = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wassh-core = { path = "../wassh-core" }

[target.'cfg(target_os = "linux")'.dependencies]
aes = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.13", features = ["hmac"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
sha1 = "0.11"

[target.'cfg(windows)'.dependencies]
wassh-sys = { path = "../wassh-sys" }
