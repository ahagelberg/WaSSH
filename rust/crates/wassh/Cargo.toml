[package]
name = "wassh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WaSSH — advanced multi-tab SSH client"

[[bin]]
name = "wassh"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
wassh-core = { path = "../wassh-core" }
wassh-plugins = { path = "../wassh-plugins" }
wassh-serial = { path = "../wassh-serial" }
wassh-store = { path = "../wassh-store" }
wassh-ssh = { path = "../wassh-ssh" }
wassh-telnet = { path = "../wassh-telnet" }
wassh-term = { path = "../wassh-term" }
wassh-ui = { path = "../wassh-ui" }
